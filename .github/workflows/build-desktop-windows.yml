name: build-desktop-windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      OPENCODE_CHANNEL: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install monorepo dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages (Turborepo)
        shell: bash
        run: bun turbo build --filter=!./packages/enterprise --filter=!./packages/storybook

      - name: Build desktop application
        run: bun run --cwd packages/desktop build

      - name: Package Windows x64 installer
        run: bun run --cwd packages/desktop package:win -- --publish never
        timeout-minutes: 30

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-windows
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: packages/desktop/dist/*.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Nightly Build' }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
          allowUpdates: true